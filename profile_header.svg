<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Ravjot Singh — Creative Technologist">

  <defs>
    <!-- shimmer sweep across title -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0.00" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="0.50" stop-color="#cfe6ff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#58a6ff" stop-opacity="0.55"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"
                        calcMode="spline" keyTimes="0;0.5;1"
                        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </linearGradient>

    <!-- kinetic pulse traveling the border -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1000" height="220" fill="#0d1117"/>

  <!-- static hairline frame -->
  <rect x="18" y="18" width="964" height="184" rx="10"
        fill="none" stroke="#58a6ff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- traveling pulse on frame -->
  <rect x="18" y="18" width="964" height="184" rx="10"
        fill="none" stroke="url(#edge)" stroke-width="1.6"
        stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="300 2000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="0" to="-2300"
             dur="14s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="500" y="103" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="46" font-weight="600" letter-spacing="6"
        fill="url(#shimmer)">RAVJOT SINGH</text>

  <!-- divider -->
  <line x1="400" y1="132" x2="600" y2="132" stroke="#58a6ff" stroke-opacity="0.30" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.14;0.42;0.14" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- subtitle -->
  <text x="500" y="163" text-anchor="middle"
        font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="15" letter-spacing="4.5"
        fill="#58a6ff" fill-opacity="0.62">CREATIVE TECHNOLOGIST &#183; REAL-TIME GRAPHICS</text>

</svg>
